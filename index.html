} @keyframes animatemsg{

} #message{

} .dialogi button{

} #importtodos{

} #confirmdialog{

    display: none;

} #big-import-dialog textarea{
    font-size: 30px;

}
    </style>
</head>
<body>
            <button id="sidebtn" onclick="showImport()"></button>
            <div id="message">JSON copied to clipboard!</div>
            <div id="navi">
                <div id="b1" onclick="changeView(1)">Schedule</div>

        <div id="container"> <!--------------------------------------------------------------->

                <div class="smallsection"> <!-- name -->
                    <p>Name:</p>

                    <p title="How often to do it">Days:</p>
                    <input size="60px" id="daysinput">

                <div class="smallsection"> <!-- buttons top -->
                    <button onclick="addToDo(
                        todonameinput.value,
                        daysinput.value
                        )"
                        >Add
                    </button>

                    <button onclick="copyToClipboard('Todos')">Export</button>

                </div>
                <div id="streakinfo" class="smallsection" style="font-size: 50px;"> <!-- streak --></div>
                <textarea id="importtodos"></textarea>
            </div>
            <div style='overflow: scroll; height:900px;' class="bigsection">

        </div>
        <div id="container3"> <!--------------------------------------------------------------->
            <div id="confirmdialog">
                <div style="width: 800px;" id="habittodelete"></div>
                <button id="confirmyes" class="addbtn">Yes</button>
                <button onclick="discardDialog()" class="addbtn">No</button>
            </div>

                <div class="smallsection"> <!-- name -->
                    <p>Name:</p>
                    <input id="habitnameinput">
                </div>
                <button class="addbtn" onclick="addHabit(
                    habitnameinput.value
                    )"
                    >Add
                </button>
                <button class="addbtn" onclick="copyToClipboard('Habits')">Export</button>
                <button class="addbtn" onclick="showImportDialog()">Import</button>
            </div>
            <div id="habitstable" style='overflow: scroll;' class="bigsection">
                <table id="habitslist"></table>
            </div>
        </div>
<script>
    if(localStorage.length == 0){
        localStorage.setItem("tasks", "[]")
        localStorage.setItem("todos", "[]")
    }
    const b1 = document.getElementById("b1");
    const b2 = document.getElementById("b2");
    const b3 = document.getElementById("b3");
    const confirmdialog = document.getElementById("confirmdialog");
    const confirmyes = document.getElementById("confirmyes");
    closeimport.addEventListener("click", ()=>{
        document.getElementById("big-import-dialog").style.display = "none"
    })
    let nextFreeTime;
    let startTimeChosen = false
    let listItemCount; // gets value with getTasks function
    let currentTask = -1
    let nextTask = -1
    let timeInterval;
    let tasks = [
        // taskName
        // startTime
        // endTime
        // timeText
        // taskNumber
    ]
    let todos = [
        // todoName
        // endDate
        // lengthDays
        // id
    ]
    let habits = [
        // habitName
        // startDate
        // id
    ]
let secondsRemaining;
let currentView = 1;
let flags = {
    controlsHidden: false,
    dialogHidden: true,
    intervalIsRunning: false,
    textareaShown : false,
}
const addTask=(name, length, startTimeStr)=>{
    let nowUnixMins = Math.floor((new Date).getHours()*60+(new Date).getMinutes());
        if(length > 0){
            if(name == ""){
                name = `Task ${tasks.length+1}`
            }
            if(!startTimeChosen){
                let h = startTimeStr.substring(0,2)
                let m = startTimeStr.substring(3)
                if(h == "" || m == ""){
                    nextFreeTime = nowUnixMins;
                }
                else{
                    nextFreeTime = Number(h)*60+Number(m);
                }
                startTimeChosen = true
            }
            else{
                nextFreeTime = tasks[tasks.length-1].endTime
            }

            let hoursStr = String(Math.floor(nextFreeTime/60)%24).padStart(2, "0")
            let minsStr = String(nextFreeTime%60).padStart(2, "0")
            let endHoursStr = String(Math.floor((nextFreeTime + length)/60)%24).padStart(2, "0")
            let endMinsStr = String((nextFreeTime + length)%60).padStart(2, "0")
            tasks.push({
                taskName : name,
                startTime : nextFreeTime,
                endTime : nextFreeTime + length,
                timeText : `${hoursStr}:${minsStr} - ${endHoursStr}:${endMinsStr}`,
                taskNumber : listItemCount+1
            })
            
            createList()
        }
                    
        listItemCount++
        searchTask()
        updateStorage()
}
const createList=()=>{
    if(JSON.stringify(tasks) != "[]" && JSON.stringify(tasks) != "null"){
        taskslist.innerHTML = ""
        for(let i = 0; i < tasks.length; i++){
                taskslist.innerHTML += `<tr><td>${tasks[i].taskName}</td><td>${tasks[i].timeText}</td><td><button onclick="deleteTask(${tasks[i].taskNumber})">x</botton></td></tr>`
        }
    }
    else{
        taskslist.innerHTML = ""
    }
}
const clearTasks=()=>{
    startTimeChosen = false;
    tasks = []
    createList()
    updateStorage()
    searchTask();
    messageAlert("Tasks cleared")
}
const deleteTask=(taskID)=>{
    tasks = tasks.filter((data)=> data.taskNumber != taskID)
    if(tasks.length == 0){
        startTimeChosen = false
    }
    createList()
    updateStorage()
    searchTask();
}
const searchTask = () => {
    currentTask = -1
    nextTask = -1
    getTasks()
    let nowUnixMins = Math.floor((new Date).getHours()*60+(new Date).getMinutes());
    if(tasks.length > 0){
        for(let i = 0; i < tasks.length; i++){  //find ongoing task
            if (tasks[i].startTime <= nowUnixMins && tasks[i].endTime > nowUnixMins) {
                currentTask = tasks[i]
                secondsRemaining = (currentTask.endTime-nowUnixMins)*60 - (new Date).getTime()/1000%60;
                break;
            }
        }
        for(let i = 0; i < tasks.length; i++){  //find next task
            if (tasks[i].startTime > nowUnixMins) {
                nextTask = tasks[i]
                secondsRemaining = (nextTask.startTime-nowUnixMins)*60 - (new Date).getTime()/1000%60;
                break;
            }
        }
        if(!flags.intervalIsRunning){     // prevent multiple simultaneous intervals
            if(currentTask == -1 && nextTask == -1){ // no interval if tasks done
                clockscreen.innerHTML = `Tasks completed`
            }
            else{
                showTime()
                timeInterval = setInterval(showTime, 1000)
                flags.intervalIsRunning = true
            }
        }
    }
    else{
        // message.innerHTML = "task list empty!"
    }

}
const showTime=()=>{
    if(currentTask == -1){
        curr = "None"
    }
    else{
        curr = currentTask.taskName
    }
    if(nextTask == -1){
        nex = "finished"
    }
    else{
        nex = nextTask.taskName
    }
    if(currentTask != -1 || nextTask != -1){
        if(secondsRemaining < 3600){
            clockscreen.innerHTML = `${curr}: ${String(Math.floor(secondsRemaining/60)).padStart(2, "0")}:${String(Math.floor(secondsRemaining%60)).padStart(2, "0")} until ${nex}`
        }
        else{
            clockscreen.innerHTML = `${curr}: ${Math.floor(secondsRemaining/3600)}:${String(Math.floor(secondsRemaining/60)%60).padStart(2, "0")}:${String(Math.floor(secondsRemaining%60)).padStart(2, "0")} until ${nex}`
        }
    }
    else{
        clockscreen.innerHTML = `Tasks completed`
    }

    if(secondsRemaining > 0 && tasks.length > 0){ // task ongoing
        secondsRemaining --;
    }
    else{ // task ended, perform search
        clearInterval(timeInterval)
        flags.intervalIsRunning = false
        searchTask()
    }
}
const updateStorage=()=>{
    switch(currentView){
        case 1:
            localStorage.setItem("tasks", JSON.stringify(tasks))
            break;
        case 2:
            localStorage.setItem("todos", JSON.stringify(todos))
            break;
        case 3:
            localStorage.setItem("habits", JSON.stringify(habits))
            break;
    }
}
const getTasks=()=>{
        if(tasks.length == 0 && localStorage.getItem("tasks") != "[]"){
            // none in array, but LS not empty
            tasks = JSON.parse(localStorage.getItem("tasks"))
            createList()
            startTimeChosen = true
        }
        else if(tasks.length == 0){
            // none in array or LS empty
            // message.innerHTML = "No tasks available."
            listItemCount = 0
        }
        if(tasks.length > 0){
            nextFreeTime = tasks[tasks.length-1].endTime
            listItemCount = tasks[tasks.length-1].taskNumber
        }
}
const hideControls=()=>{
    if(flags.controlsHidden){
        controls.style.display = "block"
        hidebtn.innerHTML = "∧"
        flags.controlsHidden = false
    }
    else{
        controls.style.display = "none"
        hidebtn.innerHTML = "∨"
        flags.controlsHidden = true
    }
}
const copyToClipboard=(mode)=>{
    switch(mode){
        case "Tasks":
            navigator.clipboard.writeText(JSON.stringify(tasks));
            break;
        case "Todos":
            navigator.clipboard.writeText(JSON.stringify(todos));
            break;
        case "Habits":
            navigator.clipboard.writeText(JSON.stringify(habits));
            break;
    }
    messageAlert(mode + " copied to clipboard!")
}
const delayTasks=(amount)=>{
    for(let i=0; i<tasks.length; i++){
        tasks[i].startTime += amount
        tasks[i].endTime += amount
        if(tasks[i].startTime > 1440){
            tasks[i].startTime -= 1440
        }
        if(tasks[i].endTime > 1440){
            tasks[i].endTime -= 1440
        }
        
        let hoursStr = String(Math.floor((tasks[i].startTime)/60)%24).padStart(2, "0")
        let minsStr = String((tasks[i].startTime)%60).padStart(2, "0")
        let endHoursStr = String(Math.floor(((tasks[i].endTime))/60)%24).padStart(2, "0")
        let endMinsStr = String(((tasks[i].endTime))%60).padStart(2, "0")
        tasks[i].timeText = `${hoursStr}:${minsStr} - ${endHoursStr}:${endMinsStr}`
    }
    createList()
    updateStorage()
}
const changeView=(view)=>{
    b1.style.backgroundColor = "rgb(97, 31, 160)"
    b2.style.backgroundColor = "rgb(97, 31, 160)"
    b3.style.backgroundColor = "rgb(97, 31, 160)"
    
    localStorage.setItem("view", view);
    switch(view){
        case 1:
            container.style.display = "block"
            container2.style.display = "none"
            container3.style.display = "none"
            b1.style.backgroundColor = "blueviolet"
            break;
        case 2:
            container.style.display = "none"
            container2.style.display = "block"
            container3.style.display = "none"
            b2.style.backgroundColor = "blueviolet"
            break;
        case 3:
            container.style.display = "none"
            container2.style.display = "none"
            container3.style.display = "block"
            b3.style.backgroundColor = "blueviolet"
            break;
    }
    currentView = view;
}
const addToDo=(name, days)=>{
    const now = Math.floor((new Date().getTime())/86400000)
    let idArray = []
    if(todos.length > 0){
        for(let i in todos){
            idArray[i] = todos[i].id
        }
    }
    else{
        idArray = [0]
    }
    if(isNaN(days) || days <= 0){
        days = 7;
    }
    if(!Number.isInteger(Number(days))){
        messageAlert(`${days} ≈ ${Math.ceil(days)}`)
        days = Math.ceil(days)
    }
    if(name == ""){
        name = "Task "+(Math.max(...idArray)+1)
    }
    todos.push({
        todoName : name,
        endDate : Number(now) + Number(days),
        lengthDays: Number(days),
        id : idArray.length > 0? (Math.max(...idArray)+1) : 1
    })
    createTodos()
    updateStorage()
}
const createTodos=()=>{
    if(JSON.stringify(todos) != "[]" && JSON.stringify(todos) != "null"){
        const now = Math.floor((new Date().getTime())/86400000);
        todos = todos.sort((a,b)=>b.lengthDays-a.lengthDays).sort((a,b)=>a.endDate-b.endDate)
        todoslist.innerHTML = ""
        for(let i = 0; i < todos.length; i++){
            let toGo = todos[i].endDate-now;
            let toDo = todos[i].todoName
            let bgColor = "rgb(139, 59, 59)"; // red
            if(toGo / todos[i].lengthDays > 0.1){
                bgColor = "rgb(84, 139, 59)" // green
            }else if(toGo >= 0){
                bgColor = "rgb(139, 124, 59)" // yellow
            }
            if(toDo.length > 12){
                toDo = toDo.substring(0,11)+"..."
            }
            todoslist.innerHTML += `<tr style="background-color:${bgColor};">
                                        <td title="${todos[i].todoName}">${toDo} <i></i></td>
                                        <td style="color:rgb(192, 192, 192); font-size:30px">(${Math.round(todos[i].lengthDays)}d)</td>
                                        <td>${Math.round(toGo)}d</td>
                                        <td><button style="width:80px" onclick="resetTodoDialog(${todos[i].id})"">✓</button></td>
                                        <td><button style="width:80px" onclick="deletionDialog(${todos[i].id})">x</button></td>
                                    </tr>`
        }
    }
    else{
        todoslist.innerHTML = ""
    }
}
const clearTodosDialog=()=>{
    navigator.clipboard.writeText(JSON.stringify(todos))
    cleartodospopup.style.display = "block"
}
const clearTodos=(abort)=>{
    if(!abort){
        todos = [];
        todoslist.innerHTML = ""
        messageAlert("Todos cleared!")
        updateStorage();
    }
    cleartodospopup.style.display = "none"
}
const getTodos=()=>{
    if(localStorage.getItem("todos")!= null){
        todos = JSON.parse(localStorage.getItem("todos"))
    }
    createTodos()
}
const chooseView=()=>{
    if(localStorage.getItem("view") != null){
        changeView(Number(localStorage.getItem("view")))
    }else{
        changeView(1)
    }
}
const deletionDialog=(id)=>{
    if(deletionprompt.innerHTML.length + completionprompt.innerHTML.length == 0){
        let taskToDelete = "";
        for(let i in todos){
            if(todos[i].id == id){
                taskToDelete = todos[i].todoName
            }
        }
        if(taskToDelete.length > 13){
            taskToDelete = taskToDelete.substring(0,12)+"..."
        }
        deletionprompt.innerHTML = "Delete " + taskToDelete + "?"
        deletionpopup.style.display = "block"
        deletetodo.addEventListener("click", ()=>{
            deleteTodo(id, false);
        })
        keeptodo.addEventListener("click", ()=>{
            deleteTodo(id, true);
        })
    }
}
const deleteTodo=(id, abort)=>{
    if(!abort){
        todos = todos.filter((a)=>a.id != id)
        createTodos()
        updateStorage()
        messageAlert("Task deleted")
    }
    deletionpopup.style.display = "none";
    deletionprompt.innerHTML = "";
}
const messageAlert=(text, color)=>{
    message.innerHTML = text
    message.style.animation = "none"
    message.offsetHeight
    message.style.animation = "animatemsg 1s"
    message.style.backgroundColor = typeof color == "undefined"? "rgb(12, 119, 12, 0.7)" : color
}
const resetTodoDialog=(id)=>{
    if(deletionprompt.innerHTML.length + completionprompt.innerHTML.length == 0){
        let taskToReset = "";
        for(let i in todos){
            if(todos[i].id == id){
                taskToReset = todos[i].todoName
            }
        }
        if(taskToReset.length > 13){
            taskToReset = taskToReset.substring(0,12)+"..."
        }
        completionprompt.innerHTML = "Reset " + taskToReset + "?"
        completionpopup.style.display = "block"
        resettodo.addEventListener("click", ()=>{
            resetTodo(id, false);
        })
        dontreset.addEventListener("click", ()=>{
            resetTodo(id, true);
        })
    }
}
const resetTodo=(id,abort)=>{
    if(!abort){
        const now = Math.floor((new Date().getTime())/86400000)
        for(let i in todos){
            if(todos[i].id == id){
                todos[i].endDate = now + todos[i].lengthDays;
                messageAlert(`${todos[i].todoName} done!`)
                createTodos()
                updateStorage()
                break;
            }
        }
    }
    completionpopup.style.display = "none";
    completionprompt.innerHTML = "";
}
const addHabit=(name)=>{
    const now = Math.floor((new Date().getTime())/86400000)
    let idArray = [] // array of id's created in order to find the largest id number
    let nulls = 0;
    if(JSON.stringify(habits) == "[]" || habits == null){
        habits = []
        idArray = [0]
    }
    else{
        for(i in habits){
            if(habits[i] == null){
                nulls++;
            }
        }
        if(habits.length-nulls > 0){ // non null habits exist
            for(let i in habits){
                if(habits[i] != null){
                    idArray.push(habits[i].id)
                }
            }
        }
        else{ // only nulls exist, they can be removed
            idArray = [0]
            habits = []
        }
    }
    if(name == ""){
        name = "Habit "+(Math.max(...idArray)+1)
    }
    habits.push({
        habitName : name,
        startDate : now,
        id : Math.max(...idArray)+1
    })
    createHabits()
    updateStorage()
}
const createHabits=()=>{
    const now = Math.floor((new Date().getTime())/86400000)
    habitslist.innerHTML = "";
    if(JSON.stringify(habits) == "[]"){ // on page load,
        habits = JSON.parse(localStorage.getItem("habits"))
    }
    if(JSON.stringify(habits) != "[]" && habits != null){
        for(i in habits){
            if(habits[i] != null){
                const timePassed = now-habits[i].startDate
                    habitslist.innerHTML += `
                    <tr key=${habits[i].id}>
                        <td>
                            ${habits[i].habitName}
                        </td>
                        <td>
                            ${timePassed}d
                        </td>
                        <td>
                            <button onclick="confirmDialog(false, ${i})" style="width : 110px" class="addbtn">↻</button>
                        </td>
                        <td>
                            <button onclick="confirmDialog(true, ${i})" style="width : 110px" class="addbtn">X</button>
                        </td>
                    </tr>
                    `;
                }
        }
    }
}
const confirmDialog=(deleteHabit, index)=>{
    const now = Math.floor((new Date().getTime())/86400000)
    habitscontrols.style.filter = "blur(10px)"
    habitstable.style.filter = "blur(10px)"
    confirmdialog.style.display = "block"
    habittodelete.innerHTML = (deleteHabit ? "Delete " : "Reset ") + habits[index].habitName + "?";
    confirmyes.onclick=()=>{
        deleteHabit ? habits[index] = null : habits[index].startDate = now;
        habitstable.style.filter = "none"
        habitscontrols.style.filter = "none"
        confirmdialog.style.display = "none"
        createHabits();
        updateStorage();
    }
}
const discardDialog=()=>{
    habitstable.style.filter = "none"
    habitscontrols.style.filter = "none"
    confirmdialog.style.display = "none"
}
const importData=()=>{
    if(importtextfield.value == "[]"){
        messageAlert("Empty array", "rgba(119, 12, 12, 0.7)")
    }
    else{
        try{
            switch(currentView){
                case 1:
                    tasks = JSON.parse(importtextfield.value); searchTask()
                    break;
                case 2:
                    todos = JSON.parse(importtextfield.value); createTodos()
                    break;
                case 3:
                    habits = JSON.parse(importtextfield.value), createHabits()
                    break;
            }
            updateStorage();
            document.getElementById("big-import-dialog").style.display = "none"
        }
        catch{
            messageAlert("Invalid JSON", "rgba(119, 12, 12, 0.7)")
        }
    }
}
const showImportDialog=()=>{
    document.getElementById("big-import-dialog").style.display = "block"
}
const showStreak=()=>{
    const now = Math.floor((new Date().getTime())/86400000);
    let streak = localStorage.getItem("streak");
    if(streak == null){
        streak = 0;
    }
    let streakEnded = false;
    const lastVisited = localStorage.getItem("lastVisited");
    if(lastVisited != null){
        for(i in todos){
            if(Number(todos[i].endDate) < now){ // task deadline before today
                streakEnded = true;
            };
        };
        if(streakEnded){
            streak = 0;
        }
        else{
            streak = Number(streak) + now - lastVisited;
        };
    };
    localStorage.setItem("lastVisited", now);
    localStorage.setItem("streak", streak);
    let longestStreak = localStorage.getItem("longestStreak");
    if(longestStreak == null || Number(longestStreak) < streak){
        longestStreak = streak;
        localStorage.setItem("longestStreak", streak);
    };
    streakinfo.innerHTML = `Streak: ${streak} days (Best: ${longestStreak} days)`
}
createHabits();
getTodos();
searchTask();
updateStorage(); // add empty array to storage if no tasks added
chooseView();
showStreak();
</script>
